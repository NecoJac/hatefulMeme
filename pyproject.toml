[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hateful-meme-semantic-retrieval"
version = "0.1.0"
description = "Semantic cue and retrieval-aware hateful meme detection."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
